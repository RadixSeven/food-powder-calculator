# First matching rule wins. `until` is a lexically-sorted filename
# cutoff (inclusive); the trailing rule has no `until` and catches
# everything else.
stores:
  - { name: MOM, until: PXL_20260426_180130578.MP.jpg }
  - { name: CVS }
