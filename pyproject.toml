[project]
name="food-powder-calculator"
description="An application for calculating the optimal food powder mix."
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask",
    "highspy",
    "maingopy",
    "mdformat",
    "pillow",
    "pre-commit",
    "pymc",
    "pyomo",
    "pyrefly",
    "pytest",
    "pyyaml",
    "ruff",
]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.pyrefly]
search-path = ["src", "stubs", "scripts"]
project-includes = ["src", "tests", "scripts"]
# Strict mode: check every code path, treat permissive constructs as errors.
check-unannotated-defs = true
infer-return-types = "never"
strict-callable-subtyping = true
spec-compliant-overloads = true
permissive-ignores = false

[tool.pyrefly.errors]
implicit-any = "error"
implicitly-defined-attribute = "error"
missing-attribute = "error"
redundant-cast = "error"
redundant-condition = "error"
unannotated-attribute = "error"
unannotated-parameter = "error"
unannotated-protocol-member = "error"
unannotated-return = "error"
unused-ignore = "error"