repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.11.13
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: 'v4.0.0-alpha.8'
    hooks:
      - id: prettier
        types_or: [java, xml, javascript, ts, html, css]
        additional_dependencies:
          - prettier@2.8.8
          - "prettier-plugin-java@1.6.1"
          - "@prettier/plugin-xml@2.2.0"
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly (strict, configured in pyproject.toml)
        language: system
        entry: uv run pyrefly check
        pass_filenames: false
        types_or: [python, pyi]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=style', '--enable=all']
